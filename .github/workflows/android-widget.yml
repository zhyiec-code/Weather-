name: Build Android widget

on:
  push:
    paths: ['android/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Signing key: repo secrets KEYSTORE_B64 / KEYSTORE_PASS when set; otherwise a key made once
      # and kept in this repo's Actions cache, so new builds install as updates over old ones.
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.qingyu-key
          key: qingyu-signing-key-v1
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
        run: |
          K=~/.qingyu-key
          mkdir -p $K
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $K/ci.keystore
            PASS="$KEYSTORE_PASS_SECRET"
          elif [ -f $K/ci.keystore ]; then
            PASS="$(cat $K/pass)"
          else
            PASS="$(openssl rand -hex 16)"
            echo -n "$PASS" > $K/pass
            keytool -genkeypair -keystore $K/ci.keystore -storepass "$PASS" -keypass "$PASS" \
              -alias qingyu -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Qingyu Widget"
          fi
          echo "::add-mask::$PASS"
          echo "KEYSTORE_FILE=$HOME/.qingyu-key/ci.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
      - name: Save signing key
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/.qingyu-key
          key: qingyu-signing-key-v1
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish to the "widget" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk qingyu-widget.apk
          gh release delete widget --yes --cleanup-tag || true
          gh release create widget qingyu-widget.apk --title "晴雨安卓小组件" \
            --notes "在安卓手机上下载 qingyu-widget.apk 并安装，然后长按桌面 → 小组件 → 晴雨温度。"
