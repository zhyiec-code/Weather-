plugins { id 'com.android.application' }
android {
    namespace 'io.github.zhyiec.qingyu'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.zhyiec.qingyu'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '2.0'
    }
    signingConfigs {
        shared {
            // Keystore is created in CI (never committed); see .github/workflows/android-widget.yml
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'ci.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'qingyu'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.shared }
        debug { signingConfig signingConfigs.shared }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
